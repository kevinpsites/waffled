# Run the test suites + typechecks on every PR and on push to main.
#
# The repo is NOT an npm-workspaces monorepo — apps/api and apps/web each have
# their own package.json + package-lock.json (npm). So each job installs with
# `npm ci` in its own app dir and caches on that app's lockfile.
#
# API tests stay on Node 20 to match the production API image. Web typechecking
# and tests use Node 24, the minimum supported by the current browser toolchain.
#
# Jobs are independent so the fast ones (typecheck, web tests) fail fast without
# waiting on the slow api job. The api integration tests use Testcontainers
# (ephemeral Postgres + wiremock), and compose-smoke builds the root image and
# boots the real compose stack; both need Docker, available on ubuntu-latest.
#
# Scope: apps/api, apps/web, and the packaging (Dockerfile, compose.yaml,
# docker/, infra/backup, the smoke script), so we run ONLY when those paths or
# this file change. Docs-only and website-only PRs skip CI entirely. (Safe
# because `main` has no required-status-check branch protection — a path-skipped
# run reports nothing, which would otherwise block a PR waiting on a check.)
name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'docker/**'
      - 'infra/backup/**'
      - 'scripts/smoke-compose.sh'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'docker/**'
      - 'infra/backup/**'
      - 'scripts/smoke-compose.sh'
      - '.github/workflows/ci.yml'

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations:
    name: Migration hygiene (no duplicate numbers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pure-Node fs check (no deps) — fails the PR if two migrations share an NNNN
      # prefix, so numbering can't silently collide across parallel branches.
      - name: Check migration numbering
        working-directory: apps/api
        run: npm run check:migrations

  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit API production dependencies
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=moderate

  typecheck:
    name: Typecheck (api + web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install api deps
        working-directory: apps/api
        run: npm ci

      - name: Typecheck api
        working-directory: apps/api
        run: npm run typecheck        # tsc --noEmit

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck        # tsc -b --noEmit

  web-tests:
    name: Web tests (vitest / jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Run web tests
        working-directory: apps/web
        run: npm test                 # vitest run

  web-browser-tests:
    name: Web browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # PR #96 establishes Node 24 as the supported web toolchain.
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: apps/web
        run: npm run test:browser

  api-tests:
    name: API tests (vitest + Testcontainers)
    runs-on: ubuntu-latest
    # The integration/unit suite now boots ONE shared Postgres (vitest globalSetup)
    # and gives each test file its own isolated database, so files run in parallel
    # (bounded fork pool) instead of each booting its own container. The slow
    # Headroom kept generous for a cold Postgres pull.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install api deps
        working-directory: apps/api
        run: npm ci

      # ubuntu-latest ships with Docker running, which is all Testcontainers needs
      # (the shared ephemeral Postgres + wiremock JWKS).
      - name: Run api tests
        working-directory: apps/api
        run: npm test                 # vitest run (unit + integration)

  compose-smoke:
    name: Compose smoke (build image, boot stack, probe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the root Dockerfile, brings up compose.yaml, checks health and
      # the SPA, then tears down (see the script header).
      - name: Run compose smoke test
        run: sh scripts/smoke-compose.sh
