# Run the native-runtime checks: the Go supervisor's own suite on every PR (fast, any OS),
# plus a macOS job that assembles the real self-contained bundle and boots the whole stack
# from an empty data dir the way a fresh Mac would.
#
# Scope, same rationale as ci.yml's header: this workflow covers apps/runtime/ (the Go
# supervisor, `waffled-runtime`), infra/native/bundle/ (the script that assembles the
# runtime/ directory it drives), apps/mac/ (the menu-bar app the bundle is embedded in) and
# infra/compose/** — Phases 2 and 3 of docs/product/native-mac-plan.md. apps/mac is here
# rather than in ci.yml because its only automated proof that matters is the assembled
# .app booting a real server, which needs the bundle this job already has. infra/compose is included even though ci.yml never
# watches it: build_config() in build.sh copies its Caddyfile/00-init.sql/powersync yaml
# into the bundle VERBATIM and `verify` asserts byte-identity against the repo, and the
# caddyconf unit test has its own drift alarm against the real Caddyfile (see
# apps/runtime/README.md "Tests") — an infra/compose edit can fail either job, and today
# nothing else in the repo watches that path. apps/api/** and apps/web/** deliberately are
# NOT in the filter below even though build.sh rebuilds both into the bundle: ci.yml already
# runs their own suites on every change, and gating the (10x-cost) macOS job on them too
# would fire it on most PRs for no matching bundle-specific coverage. Nothing else in the
# repo depends on apps/runtime or infra/native/bundle, so a PR that never touches any of
# these paths gets no run here, same as api/web-only PRs get no run in ci.yml. (Safe for the
# same reason ci.yml's header gives: main has no required-status-check branch protection.)
#
# Two jobs, split for cost as well as speed:
#   - runtime-go (ubuntu-latest) is the fast gate: gofmt, vet, unit tests. No bundle, no
#     network beyond the Go toolchain — seconds, on the cheapest runner. runtime-macos
#     `needs` it, so a formatting or unit failure costs one ubuntu minute, not a macOS run.
#   - runtime-macos needs an Apple-silicon host because the bundle IS arm64 darwin binaries
#     (Postgres, Caddy, the built PowerSync service, and now the Go supervisor itself) —
#     there is no cross-build path, and macOS minutes cost 10x an ubuntu minute. It
#     downloads/builds the ~670 MB bundle (`build.sh fetch` + `build` + `verify`, the same
#     three commands a person runs locally — see infra/native/bundle/README.md "How CI does
#     it today"), then runs the Go integration suite against it, which starts the whole
#     stack — Postgres, api, PowerSync, Caddy — from an empty temp data dir on free ports
#     and drives it through every health check. That IS the Phase 2 exit-criterion check
#     (native-mac-plan.md §7 Phase 2 item 4), not a proxy for it.
#
#     The same job then goes on to Phase 3: the Mac app's 56 unit tests, `build-app.sh` to
#     assemble Waffled.app with that bundle embedded under Contents/Resources/runtime, and a
#     smoke boot of the assembled app with NO dev-mode environment variables — only
#     WAFFLED_DATA_DIR, pointed at a temp directory. That last step is the one that cannot
#     be faked: it proves the app finds the runtime it carries, that the copy into the .app
#     still verifies against its manifest, and that a real household server comes up from an
#     empty data directory with nothing but the .app on disk. It runs here rather than as a
#     second macOS job because it needs the bundle this one already built; a second job
#     would rebuild or re-download all 670 MB of it.
#
# build.sh deliberately needs nothing preinstalled to build the bundle beyond the Xcode
# command-line tools' base utilities (lipo, rsync, xxd, curl, shasum, tar — present on every
# GitHub macOS image) — `fetch` downloads the official Node tarball first and then uses
# *that* Node's bundled npm/npx for everything else, including `npx pnpm@11.0.9` for the
# PowerSync build. So this job does NOT run actions/setup-node or install pnpm: doing so
# would set up tooling build.sh never consults (it always prepends the bundled Node's own
# bin/ to PATH before calling npm/npx — see npm_build() and the pnpm() helper in build.sh)
# and would misleadingly suggest the runner's system Node is load-bearing when it is not.
# Confirmed by running fetch/build/verify locally with no pnpm on PATH and only the bundled
# Node reachable — see the PR description for the dry-run transcript.
name: Native runtime CI

on:
  pull_request:
    paths:
      - 'apps/runtime/**'
      - 'apps/mac/**'
      - 'infra/native/bundle/**'
      - 'infra/compose/**'
      - '.github/workflows/native-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'apps/runtime/**'
      - 'apps/mac/**'
      - 'infra/native/bundle/**'
      - 'infra/compose/**'
      - '.github/workflows/native-runtime.yml'

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch) — the macOS job
# in particular is expensive enough that a stale run should never keep occupying a runner.
concurrency:
  group: native-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-go:
    name: Go checks (gofmt, vet, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/runtime/go.mod

      - name: gofmt
        working-directory: apps/runtime
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt would reformat:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        working-directory: apps/runtime
        run: go vet ./...

      - name: go test (unit only — no bundle, no -tags integration)
        working-directory: apps/runtime
        run: go test ./...

  runtime-macos:
    name: macOS bundle build + boot from empty data dir
    # Gate on the cheap job: a gofmt/vet/unit failure should never burn macOS minutes.
    needs: runtime-go
    # macos-15 is the current Apple-silicon (arm64) GitHub-hosted runner — confirmed against
    # actions/runner-images (macos-15 / macos-15-xlarge = arm64; the Intel image is the
    # differently-labelled macos-15-large/-intel). Pinned to the specific OS version rather
    # than macos-latest so this job's baseline doesn't shift out from under it the day
    # -latest moves to a newer image — the same reasoning build.sh applies to every download
    # it pins.
    runs-on: macos-15
    # Measured locally (M-series Mac, warm WAFFLED_BUNDLE_CACHE): fetch ~1s (no-op),
    # build ~45s, verify ~14s, go build <1s, integration suite (-tags integration -p 1)
    # ~4m05s. Warm total including checkout/setup overhead: comfortably under 10 minutes.
    # That's the *warm* number only — not exercised locally: a genuinely cold cache means
    # fetch_powersync does a fresh `git clone` + `pnpm install --frozen-lockfile` (619 MB
    # unpacked) + `pnpm build:production` + the prod prune, on top of the Node/Postgres/Caddy
    # downloads (README "Network cost": ~0.5-1 GB, ~5 min on a fast link) and a networked
    # `npm ci` for api + web. macos-15 standard runners are ~3 cores and slower than the dev
    # Mac this was measured on, and the 36k-file/587 MB verify walk is I/O bound.
    #
    # The Phase 3 steps turn out to be the cheap end of this job — measured on a warm run
    # (34318097623): xcodegen 2s (preinstalled), the 56 unit tests 36s, build-app.sh 35s
    # (Release build + the APFS clone of 670 MB into the .app + the embedded runtime
    # verifying its own manifest), and the smoke boot 19s, of which 6s was an empty data
    # directory becoming a running server — initdb, 96 migrations, api, PowerSync, Caddy.
    # 92 seconds for all four; the whole macOS job was 11m07s warm. 60 minutes is headroom
    # for the cold-cache path (fetch_powersync's clone, install and build, plus ~1 GB of
    # downloads) without masking a genuine hang.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/runtime/go.mod

      # Cache key is the version pins at the top of build.sh, not the whole file, so an
      # unrelated script edit (a comment, a refactor) doesn't force a ~600 MB re-download —
      # only bumping NODE_VERSION/PG_*/CADDY_VERSION/POWERSYNC_VERSION/PNPM_SPEC does. Hashed
      # into a step output rather than a file written into the checkout: build.sh's manifest
      # records `gitDirty` from `git status --porcelain` on the repo root, and an untracked
      # file sitting in the workspace during `build` would make every CI bundle claim dirty.
      - name: Compute bundle cache key
        id: pins
        run: |
          hash="$(grep -E '^(NODE_VERSION|PG_NPM_VERSION|PG_VERSION|PG_CLIENT_VERSION|CADDY_VERSION|POWERSYNC_VERSION|PNPM_SPEC)=' \
            infra/native/bundle/build.sh | shasum -a 256 | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # Split restore/save (rather than the single actions/cache step) so a failed run still
      # banks the ~1.3 GB download the moment `fetch` succeeds — actions/cache only saves on a
      # clean job exit, so without this a red integration run on a cold cache would discard
      # the whole cache and every retry on the PR would pay the full cold fetch again. A
      # `fetch` that fails partway deliberately banks nothing (the save step never runs), so a
      # half-populated cache can never poison this key for the next run.
      - name: Restore bundle cache (WAFFLED_BUNDLE_CACHE)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/WaffledBundle
          key: waffled-bundle-macos-15-${{ steps.pins.outputs.hash }}

      - name: Bundle fetch (populate cache)
        run: infra/native/bundle/build.sh fetch

      - name: Save bundle cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/WaffledBundle
          key: waffled-bundle-macos-15-${{ steps.pins.outputs.hash }}

      - name: Bundle build
        env:
          WAFFLED_BUNDLE_NPM_CI: '1'
        run: infra/native/bundle/build.sh build "$RUNNER_TEMP/runtime"

      - name: Bundle verify
        run: |
          set -o pipefail
          infra/native/bundle/build.sh verify "$RUNNER_TEMP/runtime" 2>&1 | tee "$RUNNER_TEMP/bundle-verify.log"

      - name: go build ./cmd/waffled-runtime
        working-directory: apps/runtime
        run: go build ./cmd/waffled-runtime

      # The real stack, from an empty temp data dir on free ports, through every health
      # check — the Phase 2 exit-criterion check. -p 1: the suite starts multiple stacks in
      # sequence within a package and two running concurrently would race for the same free
      # ports (apps/runtime/README.md "Tests").
      - name: Integration suite (empty data dir → full stack boot)
        working-directory: apps/runtime
        env:
          WAFFLED_BUNDLE: ${{ runner.temp }}/runtime
        run: |
          set -o pipefail
          go test -tags integration -p 1 -v ./... 2>&1 | tee "$RUNNER_TEMP/runtime-integration.log"

      # ── Phase 3: the Mac app, with that bundle embedded ──────────────────────────
      # macos-15 ships XcodeGen already, so this measures 2 seconds — it is here as a
      # guard, not a cost: the image's contents are not a contract, and a future one that
      # drops it should cost this job a bottle download rather than a red build.
      # HOMEBREW_NO_AUTO_UPDATE stops brew spending minutes refreshing its formula index
      # before deciding it has nothing to do. Waffled.xcodeproj is generated and gitignored
      # (apps/mac/CLAUDE.md), so it does have to be generated here.
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen

      # The 56 unit tests. Always -project: apps/ios has a scheme with the same name and a
      # bare -scheme Waffled from the repo root can resolve to the iOS one.
      - name: Mac app unit tests
        working-directory: apps/mac
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild test -project Waffled.xcodeproj -scheme Waffled \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mac-dd" \
            2>&1 | tee "$RUNNER_TEMP/mac-tests.log" | tail -n 30

      # Release build + the bundle cloned into Contents/Resources/runtime, then the embedded
      # supervisor verifying its own embedded bundle. ~670 MB of .app comes out of this.
      - name: Assemble Waffled.app (bundle embedded)
        run: apps/mac/Scripts/build-app.sh "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/app"

      # The one check that cannot be faked: the assembled app, with NO dev-mode environment
      # variables — no WAFFLED_RUNTIME_BIN, no WAFFLED_RUNTIME_BUNDLE — so it has to find the
      # runtime it carries, verify it, and bring a real server up from an empty data
      # directory. Only WAFFLED_DATA_DIR is set, and only to keep this run out of
      # ~/Library/Application Support/Waffled. The executable is run directly because `open`
      # cannot pass environment to an app.
      - name: Smoke boot the assembled .app (no dev-mode envs)
        env:
          APP: ${{ runner.temp }}/app/Waffled.app
          DATA: ${{ runner.temp }}/appdata
        run: |
          set -uo pipefail
          RT="$APP/Contents/Resources/runtime/bin/waffled-runtime"
          mkdir -p "$DATA"
          app_pid=""
          # Teardown, unconditionally. `start` re-execs into its own session, so killing the
          # app does NOT stop the Postgres/Caddy/api it started — and every path out of this
          # step has to free them or the runner keeps a stack (and its ports) for the rest of
          # the job. A trap covers the paths a trailing block cannot: the early `exit 1` when
          # the app dies, and any future line that fails under the step's inherited `-e`.
          # The step's exit status is decided before the trap runs, so this never changes the
          # verdict — the explicit `stop` below still owns that.
          # shellcheck disable=SC2329  # it is invoked, by the EXIT trap two lines down
          teardown() {
            "$RT" stop --data "$DATA" >/dev/null 2>&1 || true
            if [ -n "$app_pid" ]; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            return 0
          }
          trap teardown EXIT
          WAFFLED_DATA_DIR="$DATA" "$APP/Contents/MacOS/Waffled" >"$RUNNER_TEMP/mac-app.log" 2>&1 &
          app_pid=$!
          echo "app pid $app_pid"

          # Bounded at ~3 minutes: locally this is 18s, but the runner has a third of the
          # cores and pays initdb plus every migration on a cold filesystem.
          state=""
          for i in $(seq 1 90); do
            sleep 2
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::the menu-bar app exited before the server came up"
              cat "$RUNNER_TEMP/mac-app.log"
              exit 1
            fi
            # Parsed, not grepped: every service has a "state" of its own, and the first
            # one a regex finds need not be the stack's. `|| state=""`: GitHub runs each
            # step with `bash -e`, and a status that cannot answer yet (no data dir, no
            # supervisor) would otherwise end the step on its exit code instead of going
            # round the loop again.
            state="$("$RT" status --json --data "$DATA" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')" || state=""
            echo "  $((i * 2))s ${state:-(no status yet)}"
            if [ "$state" = running ]; then break; fi
          done

          rc=0
          if [ "$state" != running ]; then
            echo "::error::the assembled app never reached state=running"
            cat "$RUNNER_TEMP/mac-app.log"
            rc=1
          fi
          "$RT" status --data "$DATA" || rc=1

          # The health URL the app itself would open. /healthz is Caddy's unauthenticated
          # one, so a 200 here means Caddy, the api behind it and everything the api needed
          # to start are all up (/api/health is admin-only and answers 401 by design).
          url="$("$RT" status --json --data "$DATA" 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["urls"]["local"])')" || url=""
          if [ -n "$url" ]; then
            # `|| code=000`: curl exits 7 on a refused connection, and under the step's
            # inherited `-e` an unguarded substitution would end the step right here — the
            # one failure this check exists to report, turned into a bare red X.
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url/healthz")" || code=000
            echo "GET $url/healthz -> $code"
            [ "$code" = 200 ] || { echo "::error::$url/healthz answered $code"; rc=1; }
          else
            echo "::error::status --json reported no local URL"
            rc=1
          fi

          # Stopping is itself part of what this step proves, so a `stop` that fails is a
          # failure and not just a mess to clean up. The trap then runs a second, silent
          # teardown over whatever is left.
          "$RT" stop --data "$DATA" || rc=1
          exit $rc

      # Only on push to main: the .app is ~670 MB and no PR needs a copy of it. ditto -c -k
      # keeps the 1,338 symlinks as symlinks and the exec bits intact — upload-artifact would
      # otherwise follow every one of them and inflate a pnpm farm into thousands of copies.
      - name: Zip the assembled app (push to main only)
        if: github.event_name == 'push'
        run: ditto -c -k --keepParent "$RUNNER_TEMP/app/Waffled.app" "$RUNNER_TEMP/Waffled.app.zip"

      - name: Upload the assembled app (push to main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Waffled-app-${{ github.sha }}
          path: ${{ runner.temp }}/Waffled.app.zip
          retention-days: 3

      - name: Upload manifest + test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-macos-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime/manifest.json
            ${{ runner.temp }}/bundle-verify.log
            ${{ runner.temp }}/runtime-integration.log
            ${{ runner.temp }}/mac-tests.log
            ${{ runner.temp }}/mac-app.log
            ${{ runner.temp }}/app/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
