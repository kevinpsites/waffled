# Waffled for Mac — the shape of ~/.config/waffled/signing.conf.
#
# Copy this to ~/.config/waffled/signing.conf on the machine that cuts Mac releases and
# fill in your own values. It holds NAMES ONLY. The certificate's private key and the
# notarization credentials live in the login Keychain, which is the point: nothing secret
# is ever in this file, in the repo, or on a command line.
#
#   apps/mac/Scripts/release-mac.sh reads it; environment variables of the same name
#   override it; with no file and no variables the build is ad hoc, exactly as it is in CI.

# The codesigning identity, as `security find-identity -v -p codesigning` prints it.
# Quotes are optional — the reader strips them.
WAFFLED_SIGN_IDENTITY="Developer ID Application: Your Name (TEAMID1234)"

# The Apple Developer team, used as DEVELOPMENT_TEAM for the Xcode build. The parenthesised
# half of the identity above.
WAFFLED_TEAM_ID=TEAMID1234

# The `xcrun notarytool store-credentials` profile in the login Keychain. Create it once:
#
#   xcrun notarytool store-credentials waffled-notary \
#     --apple-id you@example.com --team-id TEAMID1234 --password <app-specific-password>
#
# The app-specific password comes from appleid.apple.com and goes into the Keychain, never
# into this file.
WAFFLED_NOTARY_PROFILE=waffled-notary
