# Waffled Android — the single version catalog.
#
# ⚠️ FROZEN after Phase 0. Feature agents must NOT add or bump entries here; a
# parallel wave editing this file is an unresolvable merge. Need a library that
# isn't listed? Stop and report it rather than adding it locally.
#
# Every version below is the latest STABLE release as of 2026-08-21 and was
# verified to resolve together — see docs/product/android-port-plan.md §0.

[versions]
# Toolchain. AGP 9 has BUILT-IN Kotlin support: do NOT add the
# org.jetbrains.kotlin.android plugin, it is a hard error. AGP 8.x cannot run on
# Gradle >= 9.6, so the wrapper is pinned deliberately.
agp = "9.3.1"
kotlin = "2.4.10"
jdk = "21"
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# Libraries
composeBom = "2026.08.00"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
lifecycle = "2.11.0"
coreSplashscreen = "1.2.0"
browser = "1.10.0"
datastore = "1.2.1"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.5.2"
powersync = "1.14.1"
coil = "3.5.0"
# NOTE: no Hilt / KSP on purpose. KSP's newest release (2.3.11) lags Kotlin
# 2.4.10, and annotation processors are exactly what breaks on a bleeding-edge
# Kotlin. DI is a hand-rolled AppContainer instead — see core/di. It also keeps
# per-module build config trivial for the parallel feature agents.

# Test
junit = "4.13.2"
mockwebserver = "5.5.0"
androidxTestRunner = "1.7.0"
androidxJunit = "1.3.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# Icons: BOM-managed (pinned 1.7.8). Deprecated upstream but still the only broad
# Material set, and the SF Symbols -> Material mapping needs the breadth. Glyphs with
# no Material equivalent are hand-rolled in core/design/WaffledIcons.kt.
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

powersync-core = { group = "com.powersync", name = "core", version.ref = "powersync" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
